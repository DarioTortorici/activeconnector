name: security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: 0 6 * * 1
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - run: uv sync --frozen --all-groups
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
      - name: Dependency audit (pip-audit)
        run: uv run --with pip-audit pip-audit || echo "pip-audit not configured; failing open in skeleton"
