[project]
name = "mwa-ad-connector"
version = "0.1.0"
description = "MWA on-prem Active Directory connector (outbound-only, FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MWA Team Identity" }]
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "uvicorn>=0.30",
  "ldap3>=2.9.1",
  "pyjwt>=2.8.0",
  "cryptography>=43.0.0",
  "structlog>=24.1.0",
  "prometheus-client>=0.20.0",
  "opentelemetry-api>=1.27.0",
  "httpx>=0.27.0",
  "azure-servicebus>=7.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "httpx>=0.27.0",
  "types-PyJWT",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mwa_ad_connector"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "S", "DTZ", "TID", "PL"]
ignore = ["PLR0913", "PLR0917"]

[tool.ruff.lint.flake8-bandit]
check-typed-exception = false

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "PLR2004", "UP017"]
"scripts/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
show_error_codes = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
[[tool.mypy.overrides]]
module = "ldap3.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "--cov=src/mwa_ad_connector --cov-report=term-missing"
markers = [
  "unit: unit tests (invariants, pure logic)",
  "contract: port/adapter equivalence tests",
  "integration: lab/AD integration tests",
  "e2e: end-to-end flow tests",
  "security: defense-in-depth negative tests",
]

[tool.coverage.run]
source = ["src/mwa_ad_connector"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
